<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CityVibe is offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: rgba(15, 23, 42, 0.78);
        --text: #e2e8f0;
        --muted: #cbd5e1;
        --accent: #60a5fa;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1e3a8a 0%, var(--bg) 42%);
        color: var(--text);
        font-family: Arial, sans-serif;
      }
      .card {
        width: min(92vw, 520px);
        background: var(--panel);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 20px;
        padding: 2rem;
        text-align: center;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.4);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 3rem);
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 1.25rem;
        color: white;
        background: linear-gradient(135deg, var(--accent), #8b5cf6);
        padding: 0.8rem 1.2rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You're offline</h1>
      <p>
        CityVibe is temporarily unavailable without a connection, but your
        latest cached view is ready when you reconnect.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
